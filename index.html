<style>
/* =========================================================================
   Default Dinner — styles
   Steel-cool neutrals, ink controls, enamel-cookware blue accent.
   ========================================================================= */
:root {
  --bg:#F2F3F0; --surface:#FFFFFF; --surface-2:#E8EAE5; --ink:#141714; --ink-2:#4B524C; --ink-3:#5C635D;
  --line:#DADED8; --line-strong:#BCC2BB;
  --accent:#2F4FA3; --accent-soft:#E2E8F6;
  --ok:#2A6A3D; --ok-soft:#E0EEE3; --warn:#855600; --warn-soft:#F5EAD3; --bad:#A1302A; --bad-soft:#F6E0DC; --on-bad:#FFFFFF;
  --btn:#141714; --on-btn:#F6F7F4;
  --bowl:#FFFFFF; --bowl-rim:#E3E5E0;
  --f-rice:#EEE8D8; --f-beef:#7B4A34; --f-chicken:#D6AB70; --f-broc:#5A8A4A; --f-leaf:#9CC47A; --f-bean:#3A3333; --f-corn:#E4BB45;
  --f-spinach:#3D6D3A; --f-cuc:#B4D29C; --f-tomato:#CF4F39; --f-potato:#D8B068; --f-scallion:#3C7631; --f-yogurt:#FFFFFF; --f-bbq:#5A2A1C;
  --f-bread:#C98F52; --f-crust:#9A6433; --f-choc:#3A2419; --f-brownie:#4A2F24; --f-brownie-hi:#6E4938; --f-dough:#D9A866; --f-glaze:#5A3A2C;
  --f-cream:#F0E4C6; --f-cream-2:#E6B6B1; --f-cup:#2F4FA3;
  --f-pasta:#E8CE8E; --f-sauce:#B5402C; --f-sausage:#9C5B3C; --f-egg:#EFC352; --f-hash:#D7A85A; --f-chili:#8E3B23; --f-peppers:#C6604A; --f-sesame:#F3EEDD; --f-parm:#F6F2E4;
  --shadow:0 1px 2px rgba(20,23,20,.05), 0 6px 20px rgba(20,23,20,.06);
  --font-display:'Schibsted Grotesk', ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-body:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --nav-h:62px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-app-theme="light"]) {
    --bg:#0E100F; --surface:#171A18; --surface-2:#222623; --ink:#ECEEEA; --ink-2:#B0B7B1; --ink-3:#848B85;
    --line:#2A2F2B; --line-strong:#3E4540;
    --accent:#94AAEE; --accent-soft:#1D2540;
    --ok:#7FC290; --ok-soft:#16281B; --warn:#E3B55D; --warn-soft:#2D2311; --bad:#F28E82; --bad-soft:#351B18; --on-bad:#1A0D0B;
    --btn:#ECEEEA; --on-btn:#0E100F;
    --bowl:#1E2220; --bowl-rim:#2F3430;
    --f-rice:#D7D1BF; --f-yogurt:#EDEDE8; --f-cup:#5D78C8; --f-bbq:#8A4A36; --f-bean:#5A5050; --f-choc:#1F130D;
    --f-sauce:#C24B33; --f-chili:#A24A2E; --f-sesame:#E8E2D0; --f-parm:#EDE8D8;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]), :root[data-app-theme="dark"] {
  --bg:#0E100F; --surface:#171A18; --surface-2:#222623; --ink:#ECEEEA; --ink-2:#B0B7B1; --ink-3:#848B85;
  --line:#2A2F2B; --line-strong:#3E4540;
  --accent:#94AAEE; --accent-soft:#1D2540;
  --ok:#7FC290; --ok-soft:#16281B; --warn:#E3B55D; --warn-soft:#2D2311; --bad:#F28E82; --bad-soft:#351B18; --on-bad:#1A0D0B;
  --btn:#ECEEEA; --on-btn:#0E100F;
  --bowl:#1E2220; --bowl-rim:#2F3430;
  --f-rice:#D7D1BF; --f-yogurt:#EDEDE8; --f-cup:#5D78C8; --f-bbq:#8A4A36; --f-bean:#5A5050; --f-choc:#1F130D;
    --f-sauce:#C24B33; --f-chili:#A24A2E; --f-sesame:#E8E2D0; --f-parm:#EDE8D8;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}

*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font-body); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
body.cooking { overflow:hidden; }
a { color:var(--accent); }
button { font:inherit; color:inherit; cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.55; }
svg { display:block; }
ul, ol { margin:0; padding:0; list-style:none; }
p { margin:0; }
h1, h2, h3 { margin:0; text-wrap:balance; }
dl, dd { margin:0; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
[tabindex="-1"]:focus { outline:none; }
.visually-hidden { position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip { position:absolute; left:-999px; top:8px; background:var(--btn); color:var(--on-btn); padding:10px 14px; border-radius:8px; z-index:100; }
.skip:focus { left:16px; }
.mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.muted { color:var(--ink-3); }
.center { text-align:center; }

/* ---------- Layout ---------- */
.app { max-width:660px; margin:0 auto; padding-inline:max(16px, env(safe-area-inset-left, 0px)); padding-block:calc(env(safe-area-inset-top, 0px) + 6px) calc(var(--nav-h) + var(--safe-b) + 28px); }
#view { outline:none; }

/* ---------- Type ---------- */
.display { font-family:var(--font-display); font-weight:800; font-size:clamp(30px, 8.6vw, 40px); line-height:1.04; letter-spacing:-.028em; margin:6px 0 18px; }
.h1 { font-family:var(--font-display); font-weight:800; font-size:clamp(27px, 7.4vw, 34px); line-height:1.08; letter-spacing:-.022em; }
.h2 { font-family:var(--font-display); font-weight:700; font-size:20px; line-height:1.2; letter-spacing:-.01em; }
.h3 { font-size:14px; font-weight:700; letter-spacing:.01em; margin:18px 0 6px; color:var(--ink); }
.label { font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin:22px 0 4px; }
.eyebrow, .kicker { font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
.lede { color:var(--ink-2); font-size:16px; max-width:36em; margin:4px 0 8px; }
.fine { font-size:12.5px; color:var(--ink-3); margin-top:8px; max-width:44em; }
.meta, .meta.mono { font-family:var(--font-body); font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

/* ---------- Header / nav ---------- */
.top { display:flex; justify-content:space-between; align-items:center; min-height:48px; }
.page-head { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:56px; margin-top:6px; }
.back { display:inline-flex; align-items:center; gap:2px; min-height:44px; margin-left:-8px; padding-right:10px; color:var(--ink-2); text-decoration:none; font-weight:600; font-size:15px; }
.back svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; }
.icon-btn { width:44px; height:44px; display:grid; place-items:center; border-radius:10px; border:0; background:transparent; color:var(--ink); flex:none; text-decoration:none; }
.icon-btn svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn:hover { background:var(--surface-2); }
.fav svg { stroke-width:1.6; }
.fav.on svg { fill:var(--ink); }
.fav-mark { color:var(--ink); }

.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px); border-top:1px solid var(--line); padding-bottom:var(--safe-b); }
.tabbar-inner { max-width:660px; margin:0 auto; display:grid; grid-template-columns:repeat(3, 1fr); padding-inline:4px; }
.tabbar a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:var(--nav-h); color:var(--ink-3); text-decoration:none; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
.tabbar svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.tabbar a[aria-current="page"] { color:var(--ink); }
.tabbar a[aria-current="page"] svg { stroke-width:2.2; }
body.cooking .tabbar { display:none; }

.tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; margin:4px 0 8px; }
.tabs::-webkit-scrollbar { display:none; }
.tabs a { flex:none; padding:12px 11px; min-height:46px; color:var(--ink-3); text-decoration:none; font-weight:600; font-size:15px; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.tabs a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--ink); }

/* ---------- Buttons & controls ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 16px; border-radius:11px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:600; font-size:15px; text-decoration:none; text-align:center; line-height:1.2; transition:background .15s, border-color .15s; }
.btn:hover { border-color:var(--ink-3); }
.btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; }
.btn.primary { background:var(--btn); color:var(--on-btn); border-color:var(--btn); }
.btn.primary:hover { opacity:.92; }
.btn.xl { width:100%; min-height:58px; font-family:var(--font-display); font-size:17px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
.btn.small { min-height:40px; padding:0 13px; font-size:14px; border-radius:9px; }
.btn.wide { width:100%; margin-top:14px; }
.btn.danger { color:var(--bad); border-color:var(--bad); }
.btn.danger-fill { background:var(--bad); color:var(--on-bad); border-color:var(--bad); }
.text-btn { background:none; border:0; color:var(--accent); font-weight:600; font-size:15px; padding:8px 4px; min-height:44px; text-decoration:none; }
.btn-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
.btn-row.center { justify-content:center; }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.seg { display:flex; flex-wrap:wrap; gap:3px; background:var(--surface-2); padding:3px; border-radius:11px; }
.seg button { flex:1 1 auto; min-height:40px; border:0; background:transparent; border-radius:8px; font-weight:600; font-size:14px; color:var(--ink-2); padding:6px 10px; line-height:1.2; }
.seg button[aria-checked="true"] { background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line-strong), 0 1px 2px rgba(0,0,0,.06); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { min-height:40px; padding:6px 14px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:14px; color:var(--ink-2); line-height:1.2; }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { background:var(--btn); color:var(--on-btn); border-color:var(--btn); }
.chip.big { min-height:46px; font-size:15px; }

input[type="checkbox"] { appearance:none; -webkit-appearance:none; width:26px; height:26px; margin:1px 0 0; border:2px solid var(--line-strong); border-radius:7px; background:var(--surface); display:grid; place-content:center; flex:none; cursor:pointer; }
input[type="checkbox"]:checked { background:var(--btn); border-color:var(--btn); }
input[type="checkbox"]:checked::after { content:''; width:12px; height:7px; border:solid var(--on-btn); border-width:0 0 2.5px 2.5px; transform:translateY(-1px) rotate(-45deg); }

.stepper { display:inline-flex; align-items:stretch; border:1px solid var(--line-strong); border-radius:11px; overflow:hidden; background:var(--surface); flex:none; }
.stepper button { width:46px; min-height:44px; border:0; background:transparent; font-size:22px; line-height:1; color:var(--ink); }
.stepper button:hover { background:var(--surface-2); }
.stepper output { min-width:76px; display:grid; place-items:center; font-size:14.5px; padding:0 6px; border-inline:1px solid var(--line); }

.switch { position:relative; width:52px; height:32px; border-radius:999px; border:0; background:var(--line-strong); flex:none; transition:background .15s; }
.switch span { position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s; }
.switch[aria-checked="true"] { background:var(--btn); }
.switch[aria-checked="true"] span { transform:translateX(20px); background:var(--on-btn); }

/* ---------- Sections ---------- */
.sec { border-top:1px solid var(--line); padding-block:20px; }
.tabs + .sec, .tabs + .lede + .sec { border-top:0; padding-top:10px; }
.sec-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; }
details.sec > summary { display:flex; justify-content:space-between; align-items:center; gap:12px; list-style:none; cursor:pointer; min-height:32px; }
details.sec > summary::-webkit-details-marker { display:none; }
details.sec > summary::after { content:''; width:9px; height:9px; border:solid var(--ink-3); border-width:0 2px 2px 0; transform:rotate(45deg); margin:0 6px 4px auto; transition:transform .15s; flex:none; }
details.sec[open] > summary::after { transform:rotate(-135deg); margin-bottom:-4px; }
details.sec > summary .sum-aside { margin-left:auto; }
details.sec > .sec-body { padding-top:8px; }
.summary { margin-top:12px; font-size:15px; color:var(--ink-2); }
.summary strong { color:var(--ink); }
.bullets { display:grid; gap:6px; }
.bullets li { position:relative; padding-left:16px; max-width:40em; }
.bullets li::before { content:''; position:absolute; left:2px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--ink-3); }
.bullets.num { counter-reset:n; }
.bullets.num li { counter-increment:n; padding-left:24px; }
.bullets.num li::before { content:counter(n); background:none; width:auto; height:auto; top:0; font-family:var(--font-mono); font-size:13px; color:var(--ink-3); }
.callout { display:block; margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--surface-2); font-size:14.5px; line-height:1.45; }
.callout strong { font-weight:700; margin-right:4px; }
.callout.warn { background:var(--warn-soft); }
.callout.warn strong { color:var(--warn); }
.callout.safe { background:var(--ok-soft); }
.callout.safe strong { color:var(--ok); }
.callout.tip { background:var(--accent-soft); }
.callout.tip strong { color:var(--accent); }
.empty { text-align:center; padding:26px 18px; border:1px dashed var(--line-strong); border-radius:14px; display:grid; gap:10px; justify-items:center; margin-block:14px; }
.empty-title { font-family:var(--font-display); font-weight:700; font-size:19px; }
.empty .muted { max-width:30em; }
.tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); background:var(--surface-2); border-radius:5px; padding:2px 6px; margin-left:6px; vertical-align:2px; }

/* ---------- Stock ---------- */
.stock { display:inline-flex; align-items:center; gap:5px; font-size:13.5px; font-weight:600; line-height:1.3; }
.stock i { font-style:normal; font-size:11px; }
.stock.in { color:var(--ok); }
.stock.low { color:var(--warn); }
.stock.out { color:var(--bad); }
.ready-line { display:block; font-size:13px; font-weight:600; }
.ready-line.ok { color:var(--ok); }
.ready-line.warn { color:var(--warn); }
.ready-line.bad { color:var(--bad); }
.ready-line.ok::before { content:'● '; }
.ready-line.warn::before { content:'◐ '; }
.ready-line.bad::before { content:'○ '; }

/* ---------- Tonight ---------- */
.banners { display:grid; gap:8px; margin:4px 0 10px; }
.banner { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; min-height:52px; padding:10px 12px 10px 14px; border:1px solid var(--line); background:var(--surface); border-radius:12px; color:var(--ink); text-decoration:none; text-align:left; font-size:15px; }
.banner.ready { border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); background:var(--ok-soft); }
.banner svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; flex:none; }
.hero { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 16px 14px; box-shadow:var(--shadow); margin-bottom:10px; }
.hero-top { display:flex; gap:14px; align-items:center; }
.hero-title { min-width:0; display:grid; gap:2px; }
.hero-name { font-family:var(--font-display); font-weight:800; font-size:25px; line-height:1.1; letter-spacing:-.018em; }
.hero-name a { color:inherit; text-decoration:none; }
.hero-name a:hover { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
.portion { margin-top:14px; padding:9px 11px; background:var(--surface-2); border-radius:9px; font-size:13.5px; color:var(--ink-2); }
.hero-actions { display:grid; gap:10px; margin-top:16px; }
.hero-actions .text-btn { justify-self:center; }
.stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px 8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.stats dt { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
.stats dd { display:flex; align-items:baseline; gap:2px; flex-wrap:wrap; }
.stats .num { font-family:var(--font-display); font-weight:700; font-size:21px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.stats .unit { font-size:12px; color:var(--ink-3); }
.stat-line { margin-top:12px; font-size:14px; color:var(--ink-2); }
.sec > .stats:first-child, .sec-body > .stats:first-child { margin-top:0; border-top:0; padding-top:0; }
.drows li { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.drows li:last-child { border-bottom:0; }
.drow-main { flex:1; display:flex; gap:12px; align-items:center; color:var(--ink); text-decoration:none; min-width:0; }
.drow-main > span { display:grid; gap:1px; min-width:0; }
.drow-name { font-weight:650; font-size:16px; }
.kcheck { display:grid; grid-template-columns:1fr 1fr; column-gap:18px; }
.kcheck li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); min-width:0; }
.kc-name { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.link-row { display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:48px; color:var(--ink); text-decoration:none; font-size:15px; }
.link-row svg { width:18px; height:18px; fill:none; stroke:var(--ink-3); stroke-width:2; flex:none; }
.sec > .link-row:only-child { min-height:40px; }

/* ---------- Lists: meals, desserts ---------- */
.mrows li.mrow { display:flex; align-items:flex-start; gap:6px; padding:14px 0; border-bottom:1px solid var(--line); }
.mrows li.mrow:last-child { border-bottom:0; }
.mrow-main { flex:1; display:flex; gap:14px; align-items:flex-start; color:var(--ink); text-decoration:none; min-width:0; }
.mrow-body { display:grid; gap:3px; min-width:0; }
.mrow-name { font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1.2; letter-spacing:-.01em; }
.mrow-flavor { font-size:14px; color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.bowl, .glyph { flex:none; max-width:100%; height:auto; }
.shared li { display:grid; grid-template-columns:1fr auto; gap:0 10px; padding:9px 0; border-bottom:1px solid var(--line); }
.sh-name { font-weight:600; }
.sh-count { font-size:13px; color:var(--ink-3); }
.sh-count::after { content:' recipes'; font-family:var(--font-body); }
.sh-list { grid-column:1 / -1; font-size:13px; color:var(--ink-3); }

.rhead { display:grid; gap:4px; margin-bottom:4px; }
.rhead-top { display:flex; align-items:center; gap:12px; }
.rhead-title { flex:1; min-width:0; }
.rhead .h1 { font-size:clamp(24px, 6.6vw, 30px); }
.rhead .fine { margin-top:2px; }
.macros { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:6px; margin-top:10px; padding:10px 0; border-block:1px solid var(--line); }
.macros dt { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.macros dd { display:flex; align-items:baseline; gap:2px; flex-wrap:wrap; }
.macros .num { font-family:var(--font-display); font-weight:700; font-size:19px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.macros .unit { font-size:11.5px; color:var(--ink-3); }
.rtabs { position:sticky; top:0; z-index:5; display:grid; grid-template-columns:repeat(4, 1fr); background:var(--bg); border-bottom:1px solid var(--line); margin:8px -16px 0; padding:0 16px; }
.rtabs button { min-height:48px; border:0; background:none; font-size:14.5px; font-weight:600; color:var(--ink-3); border-bottom:2px solid transparent; margin-bottom:-1px; padding:0 2px; }
.rtabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); }
.rpanel { padding-top:6px; min-height:40vh; }
.h3.first { margin-top:12px; }
.body-text { max-width:40em; }
.detail-line { margin:8px 0 0; font-size:14px; display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:7px; }
.more-opts { margin:-14px 0 4px; }
.rhead + .opts { padding-bottom:18px; }
.more-opts .opts { padding-block:6px 4px; }
.inv-cats { margin-top:14px; }
.inv-cat { border-bottom:1px solid var(--line); }
.inv-cat > summary { display:flex; align-items:center; gap:10px; min-height:56px; cursor:pointer; list-style:none; }
.inv-cat > summary::-webkit-details-marker { display:none; }
.inv-cat > summary::after { content:''; width:8px; height:8px; border:solid var(--ink-3); border-width:0 2px 2px 0; transform:rotate(-45deg); margin-right:6px; transition:transform .15s; flex:none; }
.inv-cat[open] > summary::after { transform:rotate(45deg); }
.inv-cat-name { flex:1; font-family:var(--font-display); font-weight:700; font-size:18px; }
.inv-cat-status { font-size:13.5px; font-weight:600; color:var(--ink-3); }
.inv-cat-status.low { color:var(--warn); }
.inv-cat-status.out { color:var(--bad); }
.inv-cat .inv { border-top:1px solid var(--line); margin-bottom:6px; }
.shop-top { display:grid; gap:4px; margin:10px 0 6px; }
.shop-top .btn.wide { margin-top:4px; }
.add-note { margin-top:6px; }
.set-group { margin-top:4px; }
.more-settings { margin-top:10px; }
.opts { display:grid; gap:14px; padding-block:14px 20px; }
.opt { display:grid; gap:6px; }
.opt-label { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
.cta-bar { position:sticky; bottom:calc(var(--nav-h) + var(--safe-b) + 10px); z-index:6; padding-top:10px; margin-top:8px; }
.cta-bar .btn { box-shadow:0 8px 24px rgba(0,0,0,.18); }

.tiers { display:grid; gap:2px; margin-top:12px; }
.tiers > div { display:grid; grid-template-columns:76px 1fr; gap:10px; padding:9px 10px; border-radius:9px; }
.tiers dt { font-weight:700; font-size:14px; color:var(--ink-3); }
.tiers dd { font-size:14.5px; color:var(--ink-2); }
.tiers > div.on { background:var(--surface-2); }
.tiers > div.on dt, .tiers > div.on dd { color:var(--ink); }

.ings li.ing { display:grid; grid-template-columns:26px 1fr auto; gap:2px 12px; align-items:start; padding:11px 0; border-bottom:1px solid var(--line); }
.ings li.ing:last-child { border-bottom:0; }
.ings label, .ing-label { display:flex; flex-direction:column; gap:1px; cursor:pointer; min-width:0; }
.ing-name { font-weight:600; font-size:15.5px; }
.ing-note { font-size:13px; color:var(--ink-3); }
.ing-amt { font-size:14px; text-align:right; padding-top:2px; white-space:nowrap; }
.ing:has(input:checked) .ing-name { color:var(--ink-3); text-decoration:line-through; text-decoration-thickness:1.5px; }
.ings.plain li.ing { grid-template-columns:1fr auto; }
.ings.plain li.ing > span:first-child { display:none; }
.ing-group + .ing-group .h3 { margin-top:16px; }
.ing-group .h3:first-child { margin-top:10px; }

.timeline li { display:grid; grid-template-columns:54px 1fr; gap:8px; padding:9px 0; border-bottom:1px dashed var(--line); }
.timeline li:last-child { border-bottom:0; }
.timeline .t { font-size:14px; color:var(--ink-2); padding-top:1px; }
.tl-body { display:grid; gap:2px; }
.tl-title { font-weight:600; }
.tl-text { font-size:14px; color:var(--ink-2); }

.more { margin-top:10px; }
.more > summary { color:var(--accent); font-weight:600; font-size:15px; cursor:pointer; min-height:40px; display:flex; align-items:center; }
.micro { width:100%; border-collapse:collapse; margin-top:6px; font-size:14px; }
.micro th, .micro td { padding:7px 0; border-bottom:1px solid var(--line); text-align:left; font-weight:400; }
.micro thead th { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
.micro td { text-align:right; }
.micro thead th:not(:first-child) { text-align:right; }

.kv { display:grid; }
.kv > div { display:grid; grid-template-columns:118px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.kv > div:last-child { border-bottom:0; }
.kv dt { font-weight:650; font-size:14px; color:var(--ink-2); }
.kv dd { font-size:15px; }
.kv.big dd { font-size:17px; }
.steps { counter-reset:s; display:grid; }
.steps li { counter-increment:s; position:relative; padding:12px 0 12px 36px; border-bottom:1px solid var(--line); display:grid; gap:3px; }
.steps li:last-child { border-bottom:0; }
.steps li::before { content:counter(s); position:absolute; left:0; top:12px; width:24px; height:24px; border-radius:50%; border:1px solid var(--line-strong); display:grid; place-items:center; font:600 12px var(--font-mono); color:var(--ink-2); }
.st-title { font-weight:650; }
.st-text { color:var(--ink-2); font-size:15px; }

/* ---------- Sweet ---------- */
.wants { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.want { display:flex; flex-direction:column; justify-content:space-between; gap:12px; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); min-height:118px; color:var(--ink); text-decoration:none; font-family:var(--font-display); font-weight:700; font-size:17px; line-height:1.15; letter-spacing:-.01em; }
.want:hover { border-color:var(--ink-3); }
.glance > div { display:grid; grid-template-columns:150px 1fr; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.glance > div:last-child { border-bottom:0; }
.glance dt { font-size:14px; font-weight:650; color:var(--ink-2); }
.glance dd a { font-weight:600; text-decoration:none; display:inline-block; padding-block:8px; margin-block:-8px; }
.glance dd a:hover { text-decoration:underline; }
.qty-more { margin-top:14px; }
.qty-more > summary { font-size:14px; font-weight:700; color:var(--ink); }
.qty-more > summary::after { content:' Show'; color:var(--accent); font-weight:600; margin-left:6px; }
.qty-more[open] > summary::after { content:' Hide'; }

/* ---------- Prep ---------- */
.split li.split-row, .bake-rows li { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.split li:last-child, .bake-rows li:last-child { border-bottom:0; }
.split-name { flex:1; font-weight:600; min-width:90px; }
.bake-rows label { display:flex; align-items:center; gap:10px; flex:1; font-weight:600; cursor:pointer; min-height:44px; }
.bake-rows .seg { flex-basis:100%; }
.qty li { display:grid; grid-template-columns:1fr auto; gap:1px 12px; padding:9px 0; border-bottom:1px solid var(--line); align-items:baseline; }
.qty li:last-child { border-bottom:0; }
.q-name { font-weight:600; font-size:15px; }
.q-use { font-size:14px; text-align:right; }
.qty .stock { grid-column:1; }
.q-buy { grid-column:2; text-align:right; font-size:12.5px; color:var(--ink-2); }
.progress-line { font-size:14px; color:var(--ink-2); margin:6px 0 2px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.progress-line .text-btn { min-height:32px; padding:0 4px; font-size:14px; }
.tasks li.task { display:grid; grid-template-columns:26px 1fr; gap:4px 12px; padding:13px 0; border-bottom:1px solid var(--line); align-items:start; }
.tasks li.task:last-child { border-bottom:0; }
.tasks label { display:grid; grid-template-columns:46px 1fr auto; gap:8px; cursor:pointer; min-width:0; }
.tasks .t { font-size:14px; color:var(--ink-2); padding-top:2px; }
.task-body { display:grid; gap:3px; min-width:0; }
.task-title { font-weight:650; font-size:15.5px; }
.task-text { font-size:14.5px; color:var(--ink-2); }
.done-word { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ok); padding-top:3px; }
.task.done .task-title { color:var(--ink-3); text-decoration:line-through; text-decoration-thickness:1.5px; }
.task.done .task-text, .task.done .callout { opacity:.6; }
.task-link { grid-column:2; justify-self:start; min-height:36px; padding:4px 0 0 58px; font-size:14px; }
.where { font-size:13px; font-weight:650; }
.where.fridge { color:var(--ok); }
.where.freeze { color:var(--accent); }
.where.bad { color:var(--bad); }
.stored li.stored-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.stored li:last-child { border-bottom:0; }
.stored-body { display:grid; gap:2px; min-width:0; }
.stored-actions { display:flex; align-items:center; gap:4px; }
.stored-row.expired .task-title { color:var(--ink-3); }

/* ---------- Inventory ---------- */
.inv-summary { display:flex; gap:18px; flex-wrap:wrap; margin:10px 0 12px; font-size:14px; color:var(--ink-2); }
.inv-summary strong { color:var(--ink); font-size:16px; margin-right:3px; }
.inv-cat .label { margin-top:24px; }
.inv-row { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; background:none; border:0; border-bottom:1px solid var(--line); text-align:left; min-height:58px; }
.inv li:last-child .inv-row { border-bottom:0; }
.inv-body { display:grid; gap:1px; min-width:0; }
.inv-name { font-weight:600; font-size:15.5px; }
.inv-used { font-size:12.5px; color:var(--ink-3); }
.pill { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:98px; height:34px; padding:0 10px; border-radius:999px; font-size:13px; font-weight:650; border:1px solid transparent; flex:none; }
.pill i { font-style:normal; font-size:11px; }
.pill.in { color:var(--ok); background:var(--ok-soft); }
.pill.low { color:var(--warn); background:var(--warn-soft); }
.pill.out { color:var(--ink-3); border-color:var(--line-strong); }
.inv-row:hover .pill { box-shadow:0 0 0 1px var(--ink-3); }
.danger-zone { margin-top:22px; padding-top:10px; border-top:1px solid var(--line); }
.checks li, .shop li { display:grid; grid-template-columns:26px 1fr; gap:12px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); }
.checks li:last-child, .shop li:last-child { border-bottom:0; }
.checks label, .shop label { cursor:pointer; display:grid; gap:1px; font-size:15.5px; }
.shop-name { font-weight:600; }
.shop-qty { font-size:13px; color:var(--ink-2); }
.shop li.done .shop-name { color:var(--ink-3); text-decoration:line-through; }
.stand { display:grid; gap:4px; font-size:16px; }
.add-item { display:flex; gap:8px; margin-top:16px; }
.add-item input { flex:1; min-width:0; min-height:44px; border:1px solid var(--line-strong); border-radius:10px; padding:0 12px; background:var(--surface); color:var(--ink); font:16px var(--font-body); }
.add-item input::placeholder { color:var(--ink-3); }
.make li { border-bottom:1px solid var(--line); }
.make li:last-child { border-bottom:0; }
.make-row { display:flex; align-items:center; gap:12px; padding:10px 0; color:var(--ink); text-decoration:none; }
.make-row > span:last-of-type { display:grid; gap:1px; min-width:0; }
.make-row.not > span:nth-child(2) { flex:1; }
ol.make { counter-reset:m; }
ol.make > li { counter-increment:m; }
ol.make .make-row::before { content:counter(m); font-family:var(--font-mono); font-size:13px; color:var(--ink-3); width:14px; flex:none; }
.make-name { font-weight:650; }
.make-note { font-size:13.5px; color:var(--ink-2); }
.make-note.ok { color:var(--ok); }
.make-note.warn { color:var(--warn); }
.make-time { flex:none; width:42px; text-align:center; background:var(--surface-2); border-radius:8px; padding:6px 0; font-size:14px; font-weight:600; }

/* ---------- Five-minute mode ---------- */
.heat li { border-bottom:1px solid var(--line); }
.heat li:last-child { border-bottom:0; }
.heat-item > summary { display:flex; align-items:center; gap:12px; padding:12px 0; cursor:pointer; list-style:none; }
.heat-item > summary::-webkit-details-marker { display:none; }
.heat-item > summary > svg:last-child { width:18px; height:18px; fill:none; stroke:var(--ink-3); stroke-width:2; transition:transform .15s; flex:none; }
.heat-item[open] > summary > svg:last-child { transform:rotate(90deg); }
.heat-body { flex:1; display:grid; gap:1px; min-width:0; }
.heat-detail { padding:0 0 16px; }
.heat-item.dim > summary { opacity:.72; }

/* ---------- Week / settings ---------- */
.log li { display:grid; grid-template-columns:44px 1fr auto; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
.log-day { color:var(--ink-3); font-size:13px; padding-top:2px; }
.set-row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
.set-row:last-child { border-bottom:0; }
.set-row.stack { flex-direction:column; align-items:stretch; gap:8px; }
.set-label { font-weight:600; display:block; }
.set-hint { display:block; font-size:13px; color:var(--ink-3); margin-top:2px; max-width:34em; }

/* ---------- Sheet / toast ---------- */
#sheet { position:fixed; inset:0; z-index:60; }
.backdrop { position:absolute; inset:0; background:rgba(8,10,9,.48); }
.sheet { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:min(660px, 100%); max-height:88vh; overflow:auto; background:var(--surface); border-radius:18px 18px 0 0; padding:14px 16px calc(18px + var(--safe-b)); animation:rise .2s ease-out; }
@keyframes rise { from { transform:translate(-50%, 24px); opacity:.4; } to { transform:translate(-50%, 0); opacity:1; } }
.sheet-inner { display:grid; gap:12px; }
.sheet-head { display:flex; justify-content:space-between; align-items:center; }
.pick { display:grid; gap:8px; }
.pick-row { width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px 10px 10px; border:1px solid var(--line); border-radius:13px; background:var(--surface); text-align:left; }
.pick-row.current { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
.pick-body { flex:1; display:grid; gap:2px; min-width:0; }
.pick-name { font-weight:700; font-size:16px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + var(--safe-b) + 84px); z-index:80; background:var(--btn); color:var(--on-btn); padding:12px 16px; border-radius:11px; font-size:15px; font-weight:600; max-width:calc(100% - 32px); width:max-content; box-shadow:0 10px 30px rgba(0,0,0,.25); }
body.cooking .toast { bottom:calc(110px + var(--safe-b)); }
.storage-warn { position:sticky; top:0; z-index:30; background:var(--warn-soft); color:var(--ink); font-size:13.5px; padding:8px 16px; text-align:center; }

/* ---------- Cooking mode ---------- */
#cook { position:fixed; inset:0; z-index:50; background:var(--bg); }
.cook { position:relative; display:flex; flex-direction:column; height:100%; height:100dvh; }
.cook-top { display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top, 0px) + 6px) max(10px, calc((100% - 660px) / 2)) 6px; }
.cook-recipe { flex:1; font-weight:650; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cook-count { font-size:14px; color:var(--ink-2); padding-right:8px; }
.progress { height:4px; background:var(--line); }
.progress span { display:block; height:100%; background:var(--ink); transition:width .25s; }
.timer-strip { display:flex; gap:8px; overflow-x:auto; padding:10px max(16px, calc((100% - 660px) / 2)) 0; scrollbar-width:none; }
.timer-strip::-webkit-scrollbar { display:none; }
.tchip { display:flex; align-items:center; gap:8px; flex:none; min-height:40px; padding:0 12px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); font-size:13.5px; }
.tchip-name { max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.tchip.running { border-color:var(--accent); }
.tchip.done { background:var(--ok-soft); border-color:var(--ok); }
.cook-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:22px max(16px, calc((100% - 660px) / 2)) 28px; }
.cook-step { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.cook-title { font-family:var(--font-display); font-weight:800; font-size:clamp(30px, 8vw, 40px); line-height:1.06; letter-spacing:-.024em; margin:6px 0 14px; outline:none; }
.cook-text { font-size:clamp(20px, 5.4vw, 23px); line-height:1.45; max-width:32em; }
.cook-sub { font-size:15px; color:var(--ink-2); margin-bottom:6px; }
.cook-body .callout { font-size:16px; margin-top:14px; }
.cook-body .h3 { font-size:15px; margin-top:22px; }
.timer-start { width:100%; min-height:68px; margin-top:22px; font-size:18px; border-width:2px; border-color:var(--ink); }
.timer-start .mono { font-size:22px; font-weight:600; }
.timer { margin-top:22px; border:2px solid var(--line-strong); border-radius:18px; padding:16px; display:grid; justify-items:center; gap:4px; }
.timer .pair { width:100%; margin-top:10px; }
.timer-big { font-size:clamp(56px, 18vw, 76px); font-weight:600; line-height:1; letter-spacing:-.02em; }
.timer-label { font-size:14px; font-weight:600; color:var(--ink-2); }
.timer.running { border-color:var(--accent); }
.timer.done { border-color:var(--ok); background:var(--ok-soft); }
.timer.done .timer-label { color:var(--ok); }
.cook-controls { display:grid; grid-template-columns:1fr 1fr 1fr 1.7fr; gap:8px; padding:10px max(12px, calc((100% - 660px) / 2)) calc(12px + var(--safe-b)); border-top:1px solid var(--line); background:var(--surface); }
.cook-controls .btn { min-height:62px; font-size:16px; padding:0 8px; border-radius:13px; }
.cook-controls .btn.primary { font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.04em; text-transform:uppercase; }
.cook-controls .span3 { grid-column:span 3; }
.check-line { display:flex; gap:12px; align-items:center; margin-top:18px; font-size:16px; }
.check-line label { cursor:pointer; }
.paused { position:absolute; inset:0; background:var(--bg); background:color-mix(in srgb, var(--bg) 96%, transparent); display:grid; place-content:center; gap:14px; text-align:center; padding:24px; }
.paused .btn { min-width:240px; }

/* ---------- Onboarding ---------- */
#onboarding { position:fixed; inset:0; z-index:70; background:var(--bg); overflow-y:auto; }
.ob { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top, 0px) + 8px) 16px calc(24px + var(--safe-b)); }
.ob-top { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:8px; min-height:52px; }
.ob-body { display:grid; gap:16px; padding-top:14px; }
.ob-body .display { margin:0; }
.ob-choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ob-choice { display:grid; place-content:center; gap:2px; min-height:108px; border:1px solid var(--line-strong); border-radius:16px; background:var(--surface); text-align:center; font-size:15px; color:var(--ink-2); }
.ob-choice.on { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); color:var(--ink); }
.ob-big { font-size:36px; font-weight:600; color:var(--ink); line-height:1.1; }
.ob-grid { display:flex; flex-wrap:wrap; gap:8px; }
.basics { justify-self:start; }

/* ---------- Responsive ---------- */
@media (max-width: 380px) {
  .stats { grid-template-columns:repeat(4, 1fr); gap:12px 4px; }
  .stats .num { font-size:18px; }
  .kv > div, .glance > div { grid-template-columns:1fr; gap:2px; }
  .kcheck { grid-template-columns:1fr; }
  .tasks label { grid-template-columns:40px 1fr auto; }
  .cook-controls .btn { font-size:15px; }
  .cook-controls .btn.primary { font-size:16px; }
}
@media (min-width: 720px) {
  .app { padding-top:24px; }
  .wants { grid-template-columns:repeat(4, 1fr); }
}
@media (hover: none) {
  .btn:hover, .want:hover { border-color:var(--line-strong); }
  .icon-btn:hover { background:transparent; }
}
@media (prefers-reduced-motion: reduce) {

.amount-box { display:grid; gap:8px; margin-top:6px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
.amount-row { display:flex; gap:8px; align-items:stretch; }
.amount-input { width:110px; min-height:44px; border:1px solid var(--line-strong); border-radius:10px; padding:0 12px; background:var(--surface); color:var(--ink); font-size:18px; }
.amount-row .seg { flex:1; }
.amount-box .fine { margin-top:0; }

/* ---------- Notes, week plan, backup, kitchen update ---------- */
.callout.note { background:var(--accent-soft); margin:10px 0 4px; }
.callout.note strong { color:var(--accent); }
.note-text { white-space:pre-wrap; }
.note-input { width:100%; min-height:88px; border:1px solid var(--line-strong); border-radius:10px; padding:10px 12px; background:var(--surface); color:var(--ink); font:16px/1.45 var(--font-body); resize:vertical; }
.week-plan { border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:0 12px; margin:12px 0 4px; }

.week-title { font-weight:700; }
.week-count { font-size:14px; color:var(--accent); font-weight:600; }
.week-plan .split { border-top:1px solid var(--line); }
.week-plan .fine { margin-bottom:10px; }
.text-btn.inline { min-height:0; padding:0 2px; font-size:13px; }
.backup .btn-row { margin-top:10px; }
.backup label.btn { cursor:pointer; }
.cook-inv { margin-top:4px; }
.seg button:focus-visible, .chip:focus-visible, .rtabs button:focus-visible { outline-offset:-2px; }

.hero.fridge { border-color:color-mix(in srgb, var(--ok) 40%, var(--line)); }
.cook-instead { padding-top:18px; }
.cook-instead .hero { box-shadow:none; }

.top-actions { display:flex; align-items:center; gap:2px; }
.timer-banner { border-color:var(--accent); }

.search { display:flex; gap:8px; align-items:center; margin:10px 0 4px; }
.search input { flex:1; min-width:0; min-height:46px; border:1px solid var(--line-strong); border-radius:10px; padding:0 12px; background:var(--surface); color:var(--ink); font:16px var(--font-body); }

.inv-cats .label { margin-top:26px; }

/* ---------- Storage (never breaks if localStorage is unavailable) ---------- */
const STORE_KEY = 'pantry.v1';
const Store = (() => {
  let ok = true, mem = null;
  try { localStorage.setItem('__pantry_t', '1'); localStorage.removeItem('__pantry_t'); } catch (e) { ok = false; }
  return {
    get ok() { return ok; },
    load() {
      if (!ok) return mem;
      try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    },
    save(s) {
      mem = s;
      if (!ok) return;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { ok = false; }
    },
    clear() { mem = null; if (ok) try { localStorage.removeItem(STORE_KEY); } catch (e) {} },
  };
})();

function defaultState() {
  return {
    v: 3,
    prefs: { portion:'standard', chickenCut:'breast', heat:'mild', theme:'system' },
    inv: {},          // id -> 'out' (anything not listed is on hand)
    shopping: [],     // [{ id, g, why, checked }]
    opts: {},         // per-recipe choices
    checks: {},       // ticked ingredient boxes
    notes: {},        // per-recipe notes
    cook: null,
    lastBackup: 0,
    ui: { mealFilter:'all', invSearch:'', rtabs:{} },
  };
}

function isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }
let S = loadState();

/* ---------- Small helpers ---------- */

const sum = arr => arr.reduce((a, b) => a + b, 0);

/* ---------- Quantity formatting ---------- */
const GLYPH = { 0.125:'⅛', 0.25:'¼', 0.333:'⅓', 0.5:'½', 0.667:'⅔', 0.75:'¾' };

const VOL = { tsp:1, tbsp:3, cup:48 };

function fmtQ(q, u) {
  if (!(q > 0)) return '';
  if (VOL[u]) {
    const tsp = q * VOL[u];
    if (tsp >= 12) {
      const cups = tsp / 48;
      const [w, f] = pickFrac(cups, [0, 0.125, 0.25, 0.333, 0.375, 0.5, 0.625, 0.667, 0.75, 0.875, 1]);
      const eighth = { 0.125:0, 0.375:0.25, 0.625:0.5, 0.875:0.75 };
      if (f in eighth) {
        const base = fracStr(w, eighth[f]);
        return (base === '0' ? '' : base + ' cup' + (w + eighth[f] > 1 ? 's' : '') + ' + ') + '2 tbsp';
      }
      return fracStr(w, f) + ' cup' + (w + f > 1 ? 's' : '');
    }
    if (tsp >= 3) {
      const [w, f] = pickFrac(tsp / 3, [0, 0.25, 0.5, 0.75, 1]);

    }
    const [w, f] = pickFrac(tsp, [0, 0.125, 0.25, 0.5, 0.75, 1]);

  const [w, f] = pickFrac(q, [0, 0.5, 1]);
  const n = (w || f) ? fracStr(w, f) : '½';
  const plural = (w + f) > 1 ? (PLURAL[u] || u + 's') : u;
  return n + ' ' + plural;
}

/* ---------- Recipe options ---------- */

function setOpt(rid, k, v) {

function cond(expr, c) {
  if (!expr) return true;
  return expr.split('&').every(t => {

    if (t === 'ready') return c.carb === 'rice' && c.rice === 'ready';
    if (t === 'rice') return c.carb === 'rice';

/* Build a fully-resolved recipe context: scaled ingredients, options, yield. */
function build(r, overrides) {

  const push = (ing, scale, extra) => c.ings.push(Object.assign({}, ing, { sq: ing.q * scale, sg: ing.g * scale, key: ing.key || ing.id, extra }));

    const prot = r.ingredients.find(i => i.role === 'protein');
    let scaleN = o.servings;

      }

    }

    const v = r.variations ? (r.variations.find(v => v.id === o.variation) || r.variations[0]) : null;

  return c;
}

// "2 servings" or "1 lb chicken thighs · 2 plates"
function amountLabel(c) {
  if (c.r.type !== 'dinner') return '';
  if (c.mode !== 'amount') return c.n + ' ' + (c.n > 1 ? 'servings' : 'serving');
  const p = c.ings.find(i => i.role === 'protein');

// Dessert batch sized to what you have (bananas).

  if (f < 0.75) { const m = Math.max(2, Math.round(f * 12)); return { id:'have', label:b + ' → ' + m + ' muffins', f, pieces:m, unit:'muffin', pan:'muffin tin (' + m + ' cups, lined or sprayed)', bake:'20–25 minutes', bakeMin:22 }; }

/* ---------- Nutrition (per serving / per piece) ---------- */

}

const roundG = v => Math.round(v);

/* ---------- Templates ---------- */
function fill(text, c) {

    out = out.replace(/\{([a-zA-Z]+)(?::([a-zA-Z0-9_]+))?\}/g, (m, k, arg) => {
      switch (k) {

        case 'riceMin': { const i = c.byKey.rice; return i && i.sq / 3 > 2.5 ? '15' : '12'; }

        case 'potTime': { const i = c.byKey.potatoes; const lb = i ? i.sq / 16 : 0; return lb > 2.2 ? 'in batches of about 1 lb, 6 minutes each' : lb > 1.1 ? '9–10 minutes, stirring halfway' : '6 minutes'; }

          return s;

        case 'sauceStyle': return c.sauce === 'smoky' ? ' and {q:smokyBoost} extra smoked paprika' : c.sauce === 'spicy' ? ' and {q:hotsauce} hot sauce' : '';
        case 'carbName': return c.carb === 'potato' ? 'Crispy potatoes' : c.carb === 'hash' ? 'Crispy hash browns' : 'Rice';
        case 'chiliBase': return c.carb === 'rice' ? 'Rice in the bowl first, then the chili over it. ' : c.carb === 'hash' ? 'Hash browns in the bowl, chili spooned over them so they stay crisp at the edges. ' : 'Chili straight into a deep bowl. ';
        case 'mix': return (c.v && c.v.mix) || 'No mix-ins for this version — move on.';

/* ---------- Steps & timeline ---------- */
function stepsFor(c) {

  const dryRice = c.byKey && c.byKey.rice ? c.byKey.rice.sq / 3 : 0;
  return c.r.steps.filter(s => cond(s.if, c)).map(s => {
    const st = Object.assign({}, s);

    if (s.key === 'potmic' && potLb > 1.1 && potLb <= 2.2) { st.timer = 10; st.passive = 10; }
    if (s.key === 'potmic' && potLb > 2.2) { st.passive = Math.ceil(potLb) * 6; }

// Tasks run back to back while hands-on; passive time (simmering, baking)
// runs in the background, and later steps can wait on a keyed task.
function schedule(steps) {
  let cursor = 0;
  const ready = {};
  const items = steps.map(s => {
    const hands = s.hands || 0, passive = s.passive || 0;
    let t = cursor;
    if (s.waitFor && ready[s.waitFor] != null) t = Math.max(t, ready[s.waitFor]);
    if (s.waitAll) Object.values(ready).forEach(x => { t = Math.max(t, x); });
    cursor = t + hands;
    if (s.key) ready[s.key] = t + hands + passive;
    else cursor += passive;
    return { s, t };
  });
  const total = Math.max(cursor, 0, ...Object.values(ready));
  return { items, total };
}

// For multi-recipe plans: whenever something finishes (roast, bake), its
// follow-up task runs next instead of waiting behind unrelated prep.
function schedulePlan(tasks) {
  const keys = new Set(tasks.filter(t => t.key).map(t => t.key));
  const ids = new Set(tasks.map(t => t.id));
  const doneIds = new Set();
  const ready = {};
  const done = new Set();
  const items = [];
  let cursor = 0;
  while (done.size < tasks.length) {
    let best = null, bestT = Infinity, bestWait = false;
    tasks.forEach((t, idx) => {
      if (done.has(idx)) return;
      // keep order relative to earlier "wait for everything" tasks and to unmet dependencies
      if (tasks.some((o, j) => j < idx && !done.has(j) && o.waitAll)) return;
      if (t.waitFor && keys.has(t.waitFor) && ready[t.waitFor] == null) return;
      if (t.after && ids.has(t.after) && !doneIds.has(t.after)) return;
      if (t.waitAll && tasks.some((o, j) => j !== idx && !done.has(j) && !o.waitAll && j < idx)) return;
      let start = cursor;
      if (t.waitFor && ready[t.waitFor] != null) start = Math.max(start, ready[t.waitFor]);
      if (t.waitAll) Object.values(ready).forEach(v => { start = Math.max(start, v); });
      const isWait = !!t.waitFor;
      if (start < bestT || (start === bestT && isWait && !bestWait)) { best = idx; bestT = start; bestWait = isWait; }
    });
    if (best != null && !tasks[best].waitFor) {
      // next time-critical task whose dependency is already running
      let crit = null, critT = Infinity;
      tasks.forEach((t, idx) => {
        if (done.has(idx) || !t.waitFor || ready[t.waitFor] == null || ready[t.waitFor] <= cursor) return;
        if (t.after && ids.has(t.after) && !doneIds.has(t.after)) return;
        if (ready[t.waitFor] < critT) { crit = idx; critT = ready[t.waitFor]; }
      });
      if (crit != null && bestT + (tasks[best].hands || 0) > critT + 2) {
        // prefer a shorter hands-on task that fits the gap; otherwise wait for the critical one
        let fit = null;
        tasks.forEach((t, idx) => {
          if (fit != null || done.has(idx) || t.waitFor || t.waitAll) return;
          if (tasks.some((o, j) => j < idx && !done.has(j) && o.waitAll)) return;
          if (t.after && ids.has(t.after) && !doneIds.has(t.after)) return;
          if (cursor + (t.hands || 0) <= critT + 2) fit = idx;
        });
        if (fit != null) { best = fit; bestT = cursor; }
        else { best = crit; bestT = critT; }
      }
    }
    if (best == null) { // unreachable dependency: fall back to array order
      best = tasks.findIndex((t, i) => !done.has(i)); bestT = cursor;
    }
    const t = tasks[best];
    items.push({ s:t, t:bestT });
    done.add(best);
    doneIds.add(t.id);
    cursor = bestT + (t.hands || 0);
    if (t.key) ready[t.key] = cursor + (t.passive || 0);
    else cursor += t.passive || 0;
  }
  const total = Math.max(cursor, 0, ...Object.values(ready));
  return { items, total };
}

function times(c) {
  const steps = stepsFor(c);
  const sch = schedule(steps);
  const active = sum(steps.map(s => s.hands || 0));
  if (c.r.type === 'dinner') {
    const prep = sum(steps.filter(s => s.prep).map(s => s.hands || 0));
    return { prep, cook: sch.total - prep, total: sch.total, active, steps, sch };
  }
  return { active, bake: bakeMin(c), total: sch.total, steps, sch };
}

function readiness(r, overrides) {

function fmtBuy(id, g) {

/* ---------- MEALS ---------- */
function mealRow(r) {
  const c = build(r);

  const rd = bestReadiness(r);
  const time = r.crockpot ? tm.active + ' min hands-on' : r.type === 'dinner' ? tm.total + ' min' : fmtDur(tm.active + tm.bake);
  const missing = rd.missingCore.concat(rd.missing);
  const status = rd.level === 'ready'
    ? '<span class="ready-line ok">Ready to make</span>'
    : `<span class="ready-line warn">Missing ${missing.length <= 2 ? esc(missing.map(lcName).join(' and ')) : missing.length + ' things'}</span>`;
  return `<li class="mrow"><a class="mrow-main" href="#/meal/${r.id}">${artFor(r, 54, getOpts(r).carb)}<span class="mrow-body">
    <span class="mrow-name">${esc(r.name)}${r.crockpot ? ' <span class="tag">crock pot</span>' : ''}</span>

function viewMeals(filter) {
  filter = ['all','dinners','prep','sweet'].includes(filter) ? filter : (S.ui.mealFilter || 'all');

  if (filter === 'dinners') list = DINNERS.filter(r => !r.crockpot);

  if (filter === 'sweet') list = DESSERTS;
  const withRd = list.map(r => ({ r, rd: bestReadiness(r) }));
  const ready = withRd.filter(x => x.rd.level === 'ready');
  const nearly = withRd.filter(x => x.rd.level !== 'ready')
    .sort((a, b) => (a.rd.missingCore.length + a.rd.missing.length) - (b.rd.missingCore.length + b.rd.missing.length));
  const need = S.shopping.filter(x => !x.checked).length;
  return `
  <header class="page-head"><h1 class="h1">Meals</h1>${need ? `<a class="btn small" href="#/shopping">Buy ${need}</a>` : `<a class="icon-btn" href="#/settings" aria-label="Settings">${ICON.gear}</a>`}</header>
  ${seg('Show', [['all','All'],['dinners','Quick'],['prep','Crock pot'],['sweet','Sweet']], filter, 'meal-filter')}
  ${ready.length
    ? section('Ready to make', `<ul class="mrows">${ready.map(x => mealRow(x.r)).join('')}</ul>`, { aside:`<span class="muted mono">${ready.length}</span>` })

}
